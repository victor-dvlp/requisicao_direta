<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index72 - Sistema de Vendas & Impressão EPSON TM-T20</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #27ae60;
      --bg: #f4f7f6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: #333;
    }

    .header-main {
      max-width: 950px;
      margin: 0 auto 20px auto;
      text-align: center;
    }

    .header-main h1 {
      margin: 0;
      color: var(--primary);
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      border-bottom: 2px solid var(--bg);
      padding-bottom: 10px;
      font-size: 1.2rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .product-card {
      border: 1px solid #e1e8ed;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      background: #fafafa;
    }

    .product-card h4 {
      margin: 6px 0;
      font-size: 14px;
    }

    .product-card .price {
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    button:hover { opacity: 0.9; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #ddd;
      font-size: 14px;
    }

    .cart-item button {
      background: #e74c3c;
      width: auto;
      padding: 2px 6px;
      font-size: 12px;
    }

    .form-group { margin-top: 15px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .total-box {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
      text-align: right;
      color: var(--primary);
    }

    .btn-print {
      background: var(--primary);
      padding: 12px;
      font-size: 16px;
    }

    #receipt-print { display: none; }

    /* --- ESTILO DE IMPRESSÃO CENTRALIZADO E ALTURA CONFIGURÁVEL --- */
    @media print {
      html, body {
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
      }

      /* ⬇️ ALTERE '120mm' AQUI PARA AUMENTAR OU DIMINUIR A FOLHA ⬇️ */
      @page {
        size: 80mm 120mm !important; 
        margin: 0mm !important;
      }

      body * {
        visibility: hidden !important;
      }

      #receipt-print, #receipt-print * {
        visibility: visible !important;
        color: #000000 !important;
        font-weight: 900 !important;
      }

      #receipt-print {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 72mm !important;
        
        /* ⬇️ DEIXE O MIN-HEIGHT IGUAL AO TAMANHO DEFINIDO NO @PAGE ACIMA ⬇️ */
        min-height: 120mm !important; 
        
        margin: 0 auto !important;
        padding: 4mm 2mm !important;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        line-height: 1.3;

        /* CENTRALIZA TODO O CONTEÚDO DO CUPOM */
        text-align: center !important; 
      }

      .receipt-header, .receipt-footer { 
        text-align: center !important; 
      }

      .receipt-title {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      .line {
        border-bottom: 2px solid #000;
        margin: 5px 0;
      }

      .receipt-table {
        width: 100%;
        border-collapse: collapse;
        margin: 5px 0;
        text-align: center !important;
      }

      .receipt-table th {
        text-align: center !important;
        border-bottom: 2px solid #000;
        font-size: 11px;
      }

      .receipt-table td {
        padding: 3px 0;
        font-size: 12px;
        text-align: center !important;
      }

      .total-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        font-weight: 900;
      }
    }
  </style>
</head>
<body>

  <div class="header-main">
    <h1>Indexsssd72</h1>
  </div>

  <div class="container">
    <div class="card">
      <h2>Moda Feminina</h2>
      <div class="products-grid" id="products-list"></div>
    </div>

    <div class="card">
      <h2>Pedido Atual</h2>
      <div id="cart-items">
        <p style="color: #888; text-align: center;">Carrinho vazio</p>
      </div>

      <div class="total-box">
        Total: R$ <span id="cart-total">0,00</span>
      </div>

      <div class="form-group">
        <label for="client-name">Nome do Cliente:</label>
        <input type="text" id="client-name" placeholder="Digite o nome do cliente">
      </div>

      <div class="form-group">
        <label for="payment-method">Forma de Pagamento:</label>
        <select id="payment-method">
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão de Crédito">Cartão de Crédito</option>
          <option value="Cartão de Débito">Cartão de Débito</option>
          <option value="Pix">Pix</option>
        </select>
      </div>

      <div class="form-group">
        <button class="btn-print" onclick="generateAndPrint()">Gerar & Imprimir Nota</button>
      </div>
    </div>
  </div>

  <!-- COMPROVANTE PARA IMPRESSÃO -->
  <div id="receipt-print">
    <div class="receipt-header">
      <div class="receipt-title">INDEX72</div>
      <div>Rua do Comércio, 123 - Centro</div>
      <div>Tel: (11) 99999-8888</div>
      <div class="line"></div>
      <div>COMPROVANTE NÃO FISCAL</div>
      <div class="line"></div>
    </div>

    <div>Data: <span id="rec-date"></span></div>
    <div>Cliente: <span id="rec-client"></span></div>
    <div>Pagamento: <span id="rec-payment"></span></div>
    <div class="line"></div>

    <table class="receipt-table">
      <thead>
        <tr>
          <th>Qtd / Item</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="rec-items"></tbody>
    </table>

    <div class="line"></div>
    <div class="total-row">
      <span>TOTAL GERAL:</span>
      <span id="rec-total">R$ 0,00</span>
    </div>
    <div class="line"></div>

    <div class="receipt-footer">
      <p style="margin: 3px 0;">Obrigado pela preferência!</p>
      <p style="margin: 3px 0; font-size: 10px;">Trocas com este comprovante em até 30 dias.</p>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Vestido Floral Midi", price: 129.90 },
      { id: 2, name: "Blusa de Seda", price: 89.90 },
      { id: 3, name: "Calça Jeans Skinny", price: 149.00 },
      { id: 4, name: "Saia Plissada", price: 79.50 },
      { id: 5, name: "Cropped Renda", price: 45.00 }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(product => `
        <div class="product-card">
          <h4>${product.name}</h4>
          <div class="price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
          <button onclick="addToCart(${product.id})">Adicionar</button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const itemInCart = cart.find(item => item.id === productId);

      if (itemInCart) {
        itemInCart.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cart-items');
      const totalContainer = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: #888; text-align: center;">Carrinho vazio</p>';
        totalContainer.innerText = '0,00';
        return;
      }

      let total = 0;
      cartContainer.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.quantity}x</strong> ${item.name}<br>
              <small>R$ ${item.price.toFixed(2).replace('.', ',')}</small>
            </div>
            <div>
              <button onclick="removeFromCart(${item.id})">X</button>
            </div>
          </div>
        `;
      }).join('');

      totalContainer.innerText = total.toFixed(2).replace('.', ',');
    }

    function generateAndPrint() {
      if (cart.length === 0) {
        alert("Adicione pelo menos um produto ao carrinho!");
        return;
      }

      const clientName = document.getElementById('client-name').value.trim() || 'Consumidor Não Identificado';
      const paymentMethod = document.getElementById('payment-method').value;

      document.getElementById('rec-date').innerText = new Date().toLocaleString('pt-BR');
      document.getElementById('rec-client').innerText = clientName;
      document.getElementById('rec-payment').innerText = paymentMethod;

      let total = 0;
      const recItemsContainer = document.getElementById('rec-items');
      recItemsContainer.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        return `
          <tr>
            <td colspan="2"><strong>${item.name}</strong></td>
          </tr>
          <tr>
            <td>${item.quantity}x (R$ ${item.price.toFixed(2).replace('.', ',')})</td>
            <td>R$ ${itemTotal.toFixed(2).replace('.', ',')}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('rec-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;

      window.print();
    }

    renderProducts();
  </script>
</body>
</html>
